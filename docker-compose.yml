version: '3.8'

services:
  whatsapp-bot:
    build: .
    container_name: wa_farm_bot
    restart: always
    environment:
      - BOT_TOKEN=ВАШ_ТОКЕН_БОТА
      - ADMIN_ID=ВАШ_TELEGRAM_ID
    # Монтируем сессии и БД, чтобы они не удалялись при перезапуске контейнера
    volumes:
      - ./data/sessions:/app/sessions
      - ./data/bot_database.db:/app/bot_database.db
    # Ограничение по памяти, чтобы Chrome не съел весь VPS
    deploy:
      resources:
        limits:
          memory: 2048M
